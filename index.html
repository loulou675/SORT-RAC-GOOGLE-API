<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SỌRT RÁC</title>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const sourceEntry = document.querySelector('script[src="/src/main.tsx"]')
        if (sourceEntry && location.hostname.endsWith('.github.io') && !location.pathname.includes('/docs/')) {
          const siteRoot = location.pathname.endsWith('/') ? location.pathname : `${location.pathname}/`
          location.replace(`${siteRoot}docs/`)
        }
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
